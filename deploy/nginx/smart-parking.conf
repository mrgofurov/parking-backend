# Smart Parking sites on the VPS's host nginx.
# Installed by deploy/nginx/setup-https.sh as /etc/nginx/sites-available/smart-parking;
# certbot then adds the HTTPS (443) parts and the http -> https redirect.
#
# It sits next to other sites (e.g. a default_server): requests are picked by
# server_name, so nothing else on the server changes. The containers listen
# on 127.0.0.1 only: admin :3000, backend :8085, capture-service :8086.

map $http_upgrade $smart_parking_connection {
    default upgrade;
    ''      close;
}

# Admin panel (its own nginx also proxies /api, /ws and the agent WebSocket)
server {
    listen 80;
    server_name ADMIN_DOMAIN;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $smart_parking_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h; # live monitor WebSocket
    }
}

# Backend API: device-agents, cameras / capture-service at the parking,
# payment callbacks
server {
    listen 80;
    server_name API_DOMAIN;
    client_max_body_size 25m; # ANPR events with JPEG snapshots

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $smart_parking_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h; # agent / live WebSockets (backend pings every 20 s)
    }
}

# Capture-service: its API can change camera settings and has no login of its
# own, so it is behind a password. The admin panel reaches it inside Docker
# and does not use this domain.
server {
    listen 80;
    server_name CAPTURE_DOMAIN;
    client_max_body_size 25m;

    auth_basic "Smart Parking capture-service";
    auth_basic_user_file /etc/nginx/smart-parking-capture.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off; # live video preview
        proxy_read_timeout 1h;
    }
}
