# Production (VPS) stack: PostgreSQL + backend. Deployed by
# .github/workflows/deploy.yml into $DEPLOY_PATH/parking-backend; settings come
# from .env next to this file (template: deploy/production.env.example).
#
# The admin panel (parking-admin) and capture-service join the same
# "smart-parking" Docker network and reach the backend as parking_backend:8085.
name: smart-parking-backend

services:
  db:
    image: postgres:16-alpine
    container_name: parking_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking_db}
      POSTGRES_USER: ${POSTGRES_USER:-parking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylida kiritilmagan}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - smart-parking
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    container_name: parking_backend
    restart: always
    env_file: .env
    environment:
      PORT: "8085"
      DB_DRIVER: postgres
      DB_SOURCE: postgres://${POSTGRES_USER:-parking}:${POSTGRES_PASSWORD}@parking_db:5432/${POSTGRES_DB:-parking_db}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env faylida kiritilmagan}
      UPLOAD_DIR: ./uploads
      TZ: ${TZ:-Asia/Tashkent}
    depends_on:
      db:
        condition: service_healthy
    # Only on the server itself: the public entry point is the admin panel's
    # nginx (it proxies /api, /ws and the agent WebSocket).
    ports:
      - "127.0.0.1:8085:8085"
    volumes:
      - uploads:/root/uploads
    networks:
      - smart-parking
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgdata:
  uploads:

networks:
  smart-parking:
    external: true
